<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" style="max-width:100%;height:auto"><title>How the sections fit together</title><desc>Five questions in sequence, from label habits to the painting's share, with a loop back to labels.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="959" height="291" rx="12" fill="#FFFFFF" stroke="#E8E6DF"/><rect x="22" y="24" width="168" height="172" rx="10" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="36" y="42" font-size="11" fill="#888780" text-anchor="start" font-weight="500" dominant-baseline="central">1</text><text x="36" y="62" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">Labels</text><text x="36" y="108" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">Do the languages use the</text><text x="36" y="125" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">emotion options</text><text x="36" y="142" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">differently?</text><text x="36" y="182" font-size="11" fill="#888780" text-anchor="start" font-weight="400" dominant-baseline="central">sections 2, 3</text><line x1="193" y1="62" x2="207" y2="62" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><rect x="210" y="24" width="168" height="172" rx="10" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="224" y="42" font-size="11" fill="#888780" text-anchor="start" font-weight="500" dominant-baseline="central">2</text><text x="224" y="62" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">Language as a</text><text x="224" y="81" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">category</text><text x="224" y="108" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">Does the chosen emotion</text><text x="224" y="125" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">give the language away?</text><text x="224" y="182" font-size="11" fill="#888780" text-anchor="start" font-weight="400" dominant-baseline="central">sections 4, 5</text><line x1="381" y1="62" x2="395" y2="62" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><rect x="398" y="24" width="168" height="172" rx="10" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="412" y="42" font-size="11" fill="#888780" text-anchor="start" font-weight="500" dominant-baseline="central">3</text><text x="412" y="62" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">Language-specific</text><text x="412" y="81" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">concepts</text><text x="412" y="108" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">Do another encoder or</text><text x="412" y="125" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">other vocabularies</text><text x="412" y="142" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">change the picture?</text><text x="412" y="182" font-size="11" fill="#888780" text-anchor="start" font-weight="400" dominant-baseline="central">sections 7, 8</text><line x1="569" y1="62" x2="583" y2="62" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><rect x="586" y="24" width="168" height="172" rx="10" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="600" y="42" font-size="11" fill="#888780" text-anchor="start" font-weight="500" dominant-baseline="central">4</text><text x="600" y="62" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">Checks</text><text x="600" y="108" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">Does each effect beat</text><text x="600" y="125" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">its shuffled version?</text><text x="600" y="182" font-size="11" fill="#888780" text-anchor="start" font-weight="400" dominant-baseline="central">all sections</text><line x1="757" y1="62" x2="771" y2="62" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><rect x="774" y="24" width="168" height="172" rx="10" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="788" y="42" font-size="11" fill="#888780" text-anchor="start" font-weight="500" dominant-baseline="central">5</text><text x="788" y="62" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">The painting's</text><text x="788" y="81" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">share</text><text x="788" y="108" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">How much does the</text><text x="788" y="125" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">painting decide, and</text><text x="788" y="142" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">does the model follow</text><text x="788" y="159" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">it?</text><text x="788" y="182" font-size="11" fill="#888780" text-anchor="start" font-weight="400" dominant-baseline="central">sections 6, 9</text><path d="M858.0 200 C 858.0 270, 106.0 270, 106.0 206" fill="none" stroke="#888780" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arr)"/></svg>