<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" style="max-width:100%;height:auto"><title>Encoder swap</title><desc>The same paintings, concepts and prompts go through two CLIP encoders, and the same three tests are rerun on each.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="959" height="249" rx="12" fill="#FFFFFF" stroke="#E8E6DF"/><text x="24" y="30" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">Swap the encoder, keep everything else</text><rect x="24" y="92" width="196" height="76" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="122" y="112" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">same paintings</text><text x="122" y="130" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">same concept list</text><text x="122" y="148" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">same English prompts</text><line x1="224" y1="130" x2="280" y2="88" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><rect x="284" y="62" width="190" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="379" y="80" font-size="14" fill="#3C3489" text-anchor="middle" font-weight="500" dominant-baseline="central">original CLIP</text><text x="379" y="98" font-size="11" fill="#3C3489" text-anchor="middle" font-weight="400" dominant-baseline="central">mostly English</text><line x1="478" y1="88" x2="518" y2="88" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><rect x="522" y="62" width="150" height="52" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="597" y="88" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">concept scores</text><line x1="676" y1="88" x2="722" y2="130" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><line x1="224" y1="130" x2="280" y2="180" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><rect x="284" y="154" width="190" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="379" y="172" font-size="14" fill="#3C3489" text-anchor="middle" font-weight="500" dominant-baseline="central">multilingual CLIP</text><text x="379" y="190" font-size="11" fill="#3C3489" text-anchor="middle" font-weight="400" dominant-baseline="central">also reads Arabic, Chinese</text><line x1="478" y1="180" x2="518" y2="180" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><rect x="522" y="154" width="150" height="52" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="597" y="180" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">concept scores</text><line x1="676" y1="180" x2="722" y2="130" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><rect x="726" y="76" width="210" height="108" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="831" y="98" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="500" dominant-baseline="central">the same tests</text><text x="831" y="124" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400" dominant-baseline="central">section 1 bottleneck</text><text x="831" y="142" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400" dominant-baseline="central">section 4 classifier</text><text x="831" y="160" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400" dominant-baseline="central">section 5 swap test</text></svg>