<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" style="max-width:100%;height:auto"><title>Four concept vocabularies</title><desc>Generic, translated, native and native-without-feeling-words concept lists per language head; native words are mined only from paintings outside the tested set.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="959" height="399" rx="12" fill="#FFFFFF" stroke="#E8E6DF"/><text x="24" y="30" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">Which concept list each language's head uses</text><text x="210.0" y="62" font-size="12" fill="#0C447C" text-anchor="middle" font-weight="400" dominant-baseline="central">english head</text><rect x="134" y="72" width="152" height="3" rx="1.5" fill="#378ADD"/><text x="374.0" y="62" font-size="12" fill="#712B13" text-anchor="middle" font-weight="400" dominant-baseline="central">arabic head</text><rect x="298" y="72" width="152" height="3" rx="1.5" fill="#D85A30"/><text x="538.0" y="62" font-size="12" fill="#085041" text-anchor="middle" font-weight="400" dominant-baseline="central">chinese head</text><rect x="462" y="72" width="152" height="3" rx="1.5" fill="#1D9E75"/><text x="24" y="110" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">generic</text><rect x="134" y="88" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="210.0" y="110" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">a boat · the sea · red</text><rect x="298" y="88" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="374.0" y="110" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">a boat · the sea · red</text><rect x="462" y="88" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="538.0" y="110" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">a boat · the sea · red</text><text x="24" y="172" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">translated</text><rect x="134" y="150" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="210.0" y="172" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">a boat · the sea · red</text><rect x="298" y="150" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="374.0" y="172" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">قارب · البحر · أحمر</text><rect x="462" y="150" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="538.0" y="172" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">小船 · 大海 · 红色</text><text x="24" y="234" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">native</text><rect x="134" y="212" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="210.0" y="234" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">colors · man · beautiful</text><rect x="298" y="212" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="374.0" y="234" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">رجل · لون · جميلة</text><rect x="462" y="212" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="538.0" y="234" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">感到 · 满足 · 女人</text><text x="24" y="288" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">native, no</text><text x="24" y="304" font-size="13" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">feeling words</text><rect x="134" y="274" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="210.0" y="296" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">colors · man · woman</text><rect x="298" y="274" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="374.0" y="296" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">رجل · لون · اشجار</text><rect x="462" y="274" width="152" height="44" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="538.0" y="296" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">女人 · 穿着 · 男人</text><text x="24" y="362" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="400" dominant-baseline="central">all four scored with the multilingual CLIP; same list length</text><text x="660" y="30" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="500" dominant-baseline="central">Where native words come from</text><rect x="660" y="70" width="150" height="64" rx="8" fill="#F6F5F1" stroke="#B4B2A9" stroke-width="0.75"/><text x="735" y="92" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">71,244 other paintings</text><text x="735" y="110" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="400" dominant-baseline="central">(original ArtELingo)</text><line x1="735" y1="138" x2="735" y2="170" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><text x="735" y="188" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400" dominant-baseline="central">most common words</text><text x="735" y="205" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400" dominant-baseline="central">that are concepts</text><text x="735" y="222" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="400" dominant-baseline="central">→ native lists</text><line x1="735" y1="236" x2="735" y2="266" stroke="#888780" stroke-width="1.25" marker-end="url(#arr)"/><rect x="660" y="270" width="150" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="735" y="292" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="400" dominant-baseline="central">feeling words labelled</text><text x="735" y="310" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="400" dominant-baseline="central">and dropped</text><line x1="830" y1="62" x2="830" y2="340" stroke="#B4B2A9" stroke-dasharray="4 4"/><rect x="846" y="70" width="92" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="892" y="92" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="400" dominant-baseline="central">our 840</text><text x="892" y="110" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="400" dominant-baseline="central">paintings</text><text x="892" y="168" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400" dominant-baseline="central">tested here;</text><text x="892" y="184" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400" dominant-baseline="central">never mined,</text><text x="892" y="200" font-size="11" fill="#5F5E5A" text-anchor="middle" font-weight="400" dominant-baseline="central">so nothing leaks</text></svg>