[project]
name = "artcbm"
version = "0.1.0"
description = "Concept bottleneck analyses on ArtELingo (HCML course project)"
readme = "README.md"
authors = [
    { name = "machinic-hetarchy", email = "ashley.lo@student.uva.nl" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "open-clip-torch>=4.2.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
